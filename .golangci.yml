version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - unconvert
    - unparam
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aillion-co/infrastructure-lz
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
