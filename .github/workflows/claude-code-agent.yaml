name: Claude Code Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    name: Run Claude Code
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          allowed_tools: |
            Bash
            Read
            Write
            Edit
            Glob
            Grep
            TodoWrite
          custom_instructions: |
            You are working on the infrastructure-lz project. Read CLAUDE.md for full context.

            MANDATORY before committing any change:
            1. Run: go vet ./...
            2. Run: golangci-lint run ./...
            3. Run: go test -race ./...

            All three must pass. Fix any failures before committing.

            When implementing features:
            - Write tests alongside implementation
            - Follow existing code patterns
            - Keep changes small and focused
            - Use table-driven tests

            When fixing issues:
            - Reproduce the bug with a failing test first
            - Fix the code to make the test pass
            - Verify no other tests break
