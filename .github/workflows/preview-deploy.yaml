name: Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_REGION: ${{ secrets.GKE_REGION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GO_VERSION: "1.23"

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Build and push Docker image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/iac-generator"
          TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          docker build -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Deploy preview
        id: deploy
        run: |
          NAMESPACE="preview-pr-${{ github.event.pull_request.number }}"
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install \
            "iac-generator-preview" \
            deploy/helm/iac-generator/ \
            --namespace "${NAMESPACE}" \
            --set image.repository="${IMAGE}" \
            --set image.tag="${TAG}" \
            --set ingress.enabled=true \
            --set ingress.host="pr-${{ github.event.pull_request.number }}.preview.iac-generator.internal" \
            --set replicaCount=1 \
            --set resources.requests.memory=128Mi \
            --set resources.requests.cpu=100m \
            --wait --timeout=300s

          PREVIEW_URL="http://pr-${{ github.event.pull_request.number }}.preview.iac-generator.internal"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/iac-generator-preview \
            -n "preview-pr-${{ github.event.pull_request.number }}" \
            --timeout=120s

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            -n "preview-pr-${{ github.event.pull_request.number }}" \
            --image=curlimages/curl:latest -- \
            curl -sf http://iac-generator-preview:8080/healthz

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Preview Deployment\n\n` +
              `**Status:** Deployed\n` +
              `**Namespace:** \`preview-pr-${{ github.event.pull_request.number }}\`\n` +
              `**Image:** \`${process.env.IMAGE}:${process.env.TAG}\`\n\n` +
              `Smoke test passed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview Deployment'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  e2e:
    name: E2E Tests
    needs: [preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Port-forward and run E2E tests
        run: |
          NAMESPACE="preview-pr-${{ github.event.pull_request.number }}"
          kubectl port-forward -n "${NAMESPACE}" svc/iac-generator-preview 8080:8080 &
          sleep 5
          E2E_BASE_URL=http://localhost:8080 go test -v -tags=e2e ./test/e2e/...
