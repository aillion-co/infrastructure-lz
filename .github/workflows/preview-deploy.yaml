name: Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_REGION: ${{ secrets.GKE_REGION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GO_VERSION: "1.25"

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Build and push Docker image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/iac-generator"
          TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          docker build \
            --build-arg VERSION="${TAG}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Deploy preview
        id: deploy
        run: |
          NAMESPACE="preview-pr-${{ github.event.pull_request.number }}"
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install \
            "iac-generator-preview" \
            deploy/helm/iac-generator/ \
            --namespace "${NAMESPACE}" \
            --set image.repository="${IMAGE}" \
            --set image.tag="${TAG}" \
            --set ingress.enabled=true \
            --set ingress.host="pr-${{ github.event.pull_request.number }}.preview.iac-generator.internal" \
            --set replicaCount=1 \
            --set resources.requests.memory=128Mi \
            --set resources.requests.cpu=100m \
            --wait --timeout=300s

          PREVIEW_URL="http://pr-${{ github.event.pull_request.number }}.preview.iac-generator.internal"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/iac-generator-preview \
            -n "preview-pr-${{ github.event.pull_request.number }}" \
            --timeout=120s

      - name: Smoke test
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            -n "preview-pr-${{ github.event.pull_request.number }}" \
            --image=curlimages/curl:latest -- \
            curl -sf http://iac-generator-preview:8080/healthz

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Preview Deployment\n\n` +
              `**Status:** Deployed\n` +
              `**Namespace:** \`preview-pr-${{ github.event.pull_request.number }}\`\n` +
              `**Image:** \`${process.env.IMAGE}:${process.env.TAG}\`\n\n` +
              `Smoke test passed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview Deployment'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  integration:
    name: Integration Tests
    needs: [preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Port-forward to preview
        run: |
          NAMESPACE="preview-pr-${{ github.event.pull_request.number }}"
          kubectl port-forward -n "${NAMESPACE}" svc/iac-generator-preview 8080:8080 &
          PF_PID=$!
          echo "PF_PID=${PF_PID}" >> $GITHUB_ENV

          # Wait for port-forward to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Port-forward ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Port-forward failed to become ready"
              exit 1
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          INTEGRATION_BASE_URL=http://localhost:8080 \
            go test -v -race -tags=integration -count=1 -timeout=5m \
            ./test/integration/...

      - name: Run E2E tests
        run: |
          E2E_BASE_URL=http://localhost:8080 \
            go test -v -race -tags=e2e -count=1 -timeout=5m \
            ./test/e2e/...

      - name: Cleanup port-forward
        if: always()
        run: |
          if [ -n "${PF_PID}" ]; then
            kill "${PF_PID}" 2>/dev/null || true
          fi

      - name: Post test results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'Passed' : 'Failed';
            const emoji = status === 'Passed' ? ':white_check_mark:' : ':x:';
            const body = `### Integration & E2E Tests ${emoji}\n\n` +
              `**Status:** ${status}\n` +
              `**Namespace:** \`preview-pr-${{ github.event.pull_request.number }}\`\n` +
              `**Commit:** \`${{ github.sha }}\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Integration & E2E Tests'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
