apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: acme-cicd
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
  displayName: CI/CD Service Account for acme
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: acme-cicd-project-creator
  namespace: config-connector
spec:
  member: serviceAccount:acme-cicd@acme-mgmt.iam.gserviceaccount.com
  role: roles/resourcemanager.projectCreator
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Organization
    external: 123456789012
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: acme-cicd-billing-user
  namespace: config-connector
spec:
  member: serviceAccount:acme-cicd@acme-mgmt.iam.gserviceaccount.com
  role: roles/billing.user
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    name: acme-mgmt
