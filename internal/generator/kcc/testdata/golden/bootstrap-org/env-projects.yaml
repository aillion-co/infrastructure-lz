
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Folder
metadata:
  name: acme-dev
  namespace: config-connector
spec:
  displayName: acme-dev
  folderRef:
    name: acme-mgmt
---
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Project
metadata:
  name: acme-platform-dev
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/auto-create-network: "false"
spec:
  name: acme-platform-dev
  folderRef:
    name: acme-dev
  billingAccountRef:
    external: AAAAAA-BBBBBB-CCCCCC
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-platform-dev-compute
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-platform-dev
spec:
  resourceID: compute.googleapis.com
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-platform-dev-container
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-platform-dev
spec:
  resourceID: container.googleapis.com
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSharedVPCServiceProject
metadata:
  name: acme-platform-dev-service
  namespace: config-connector
spec:
  projectRef:
    name: acme-platform-dev
  hostProjectRef:
    name: acme-mgmt
---

