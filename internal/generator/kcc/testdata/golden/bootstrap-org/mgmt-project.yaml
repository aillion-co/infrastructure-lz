---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-mgmt-container
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
  resourceID: container.googleapis.com
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-mgmt-iam
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
  resourceID: iam.googleapis.com
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-mgmt-cloudbuild
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
