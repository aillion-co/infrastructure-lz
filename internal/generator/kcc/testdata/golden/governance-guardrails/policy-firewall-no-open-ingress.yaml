apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: gcpfirewallnoopeningress
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    description: "Deny firewall rules that allow ingress from 0.0.0.0/0"
spec:
  crd:
    spec:
      names:
        kind: GcpFirewallNoOpenIngress
      validation:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package gcpfirewallnoopeningress

        # Only allow-rules are a risk; a deny-rule sourced from 0.0.0.0/0 is a
        # legitimate control and must not be flagged.
        violation[{"msg": msg}] {
          obj := input.review.object
          obj.kind == "ComputeFirewall"
          not obj.spec.direction == "EGRESS"
          obj.spec.allow
          obj.spec.sourceRanges[_] == "0.0.0.0/0"
          msg := "ComputeFirewall must not allow ingress from 0.0.0.0/0"
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GcpFirewallNoOpenIngress
metadata:
  name: firewall-no-open-ingress
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    compliance.aillion.co/regimes: "cis,nis2,pci-dss"
    description: "Deny firewall rules that allow ingress from 0.0.0.0/0"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["*"]
        kinds: ["ComputeFirewall"]
