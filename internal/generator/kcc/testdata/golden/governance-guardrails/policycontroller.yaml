apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-mgmt-gkehub
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
  resourceID: gkehub.googleapis.com
---
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: acme-mgmt-anthospolicycontroller
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: acme-mgmt
spec:
  resourceID: anthospolicycontroller.googleapis.com
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeature
metadata:
  name: policycontroller
  namespace: config-connector
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
spec:
  projectRef:
    external: projects/acme-mgmt
  location: global
  resourceID: policycontroller
---
apiVersion: gkehub.cnrm.cloud.google.com/v1beta1
kind: GKEHubFeatureMembership
metadata:
  name: policycontroller-config-controller
  namespace: config-connector
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
spec:
  projectRef:
    external: projects/acme-mgmt
  location: global
  membershipRef:
    name: config-controller
  featureRef:
    name: policycontroller
  policycontroller:
    policyControllerHubConfig:
      # INSTALL_SPEC_ENABLED installs the Gatekeeper admission controller on
      # the membership; without it the constraints in this chart never run.
      installSpec: INSTALL_SPEC_ENABLED
      auditIntervalSeconds: 60
      referentialRulesEnabled: true
      logDeniesEnabled: true
      mutationEnabled: false
      policyContent:
        templateLibrary:
          installation: ALL
      monitoring:
        backends:
          - CLOUD_MONITORING
          - PROMETHEUS
