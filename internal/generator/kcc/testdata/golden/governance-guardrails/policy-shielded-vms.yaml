apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: gcpshieldedvms
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    description: "Require Shielded VM secure boot on Compute Engine instances"
spec:
  crd:
    spec:
      names:
        kind: GcpShieldedVms
      validation:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package gcpshieldedvms

        violation[{"msg": msg}] {
          input.review.object.kind == "ComputeInstance"
          not input.review.object.spec.shieldedInstanceConfig.enableSecureBoot == true
          msg := "ComputeInstance must enable Shielded VM secure boot"
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GcpShieldedVms
metadata:
  name: shielded-vms
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    compliance.aillion.co/regimes: "cis,eucra"
    description: "Require Shielded VM secure boot on Compute Engine instances"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["*"]
        kinds: ["ComputeInstance"]
