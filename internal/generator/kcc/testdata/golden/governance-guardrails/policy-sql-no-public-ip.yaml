apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: gcpsqlnopublicip
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    description: "Deny Cloud SQL instances with public IPv4 connectivity"
spec:
  crd:
    spec:
      names:
        kind: GcpSqlNoPublicIp
      validation:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package gcpsqlnopublicip

        # Cloud SQL enables a public IPv4 address by default, so a violation must
        # fire unless ipv4Enabled is explicitly set to false.
        violation[{"msg": msg}] {
          input.review.object.kind == "SQLInstance"
          not input.review.object.spec.settings.ipConfiguration.ipv4Enabled == false
          msg := "SQLInstance must explicitly disable public IPv4 (spec.settings.ipConfiguration.ipv4Enabled: false)"
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GcpSqlNoPublicIp
metadata:
  name: sql-no-public-ip
  labels:
    managed-by: activations-accelerator
    feature: governance-guardrails
  annotations:
    compliance.aillion.co/regimes: "cis,iso27001,pci-dss"
    description: "Deny Cloud SQL instances with public IPv4 connectivity"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["*"]
        kinds: ["SQLInstance"]
